<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>운동 기록 등록</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            min-height: 100vh;
            background-color: #17191f;
            color: #f9fafb;
        }
        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 24px;
        }
        .logo {
            color: #38a3ff;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 32px;
        }
        .form-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background-color: #20222b;
            border: 1px solid #343743;
            border-radius: 28px;
            overflow: hidden;
            min-height: 620px;
        }
        .form-left {
            padding: 52px;
            border-right: 1px solid #343743;
        }
        .form-right {
            padding: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #9ca3af;
        }
        h1 {
            font-size: 40px;
            font-weight: 900;
            margin-bottom: 16px;
        }
        .description {
            color: #9ca3af;
            margin-bottom: 42px;
            line-height: 1.6;
        }
        .form-label {
            color: #cbd5e1;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .form-control, .form-select {
            background-color: #292c36;
            border: 1px solid #3b3f4c;
            color: #f9fafb;
            border-radius: 16px;
            padding: 16px 18px;
            height: 58px;
        }
        .form-control::placeholder { color: #6b7280; }
        .form-control:focus, .form-select:focus {
            background-color: #292c36;
            color: #f9fafb;
            border-color: #38a3ff;
            box-shadow: 0 0 0 3px rgba(56,163,255,0.15);
        }
        .helper-box {
            background-color: #292c36;
            border: 1px solid #3b3f4c;
            border-radius: 16px;
            color: #9ca3af;
            padding: 18px;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .main-btn {
            background-color: #38a3ff;
            border: none;
            color: white;
            border-radius: 16px;
            padding: 15px 28px;
            font-weight: 800;
            cursor: pointer;
        }
        .main-btn:hover { background-color: #1688e8; }
        .sub-btn {
            border: 1px solid #4b5563;
            color: #e5e7eb;
            border-radius: 16px;
            padding: 15px 28px;
            font-weight: 800;
            text-decoration: none;
            background: none;
            cursor: pointer;
        }
        .sub-btn:hover { border-color: #6b7280; color: white; }
        .right-icon { font-size: 54px; margin-bottom: 24px; }
        .right-title { font-size: 22px; font-weight: 800; color: #f9fafb; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="page">
    <div class="logo">NO RUN NO LIFE</div>
    <div class="form-card">
        <div class="form-left">
            <h1>운동 기록 등록</h1>
            <p class="description">오늘의 운동을 기록하고<br>나만의 운동 루틴을 쌓아보세요.</p>

            <div class="mb-4">
                <label class="form-label">운동 종류</label>
                <select id="type" class="form-select">
                    <option value="RUNNING">러닝</option>
                    <option value="BOXING">복싱</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label">운동 시간</label>
                <input type="number" id="duration" class="form-control" min="1" placeholder="분 단위로 입력하세요. 예: 30">
            </div>
            <div class="mb-4">
                <label class="form-label">운동 메모</label>
                <input type="text" id="memo" class="form-control" placeholder="예: 샌드백 10R 진행">
            </div>
            <div class="helper-box">
                입력한 운동 기록은 목록 화면에서 바로 확인할 수 있습니다.
                서버를 재시작하면 메모리 저장소의 기록은 초기화됩니다.
            </div>
            <div class="d-flex gap-3">
                <button class="btn main-btn" onclick="submitWorkout()">기록 저장하기</button>
                <a href="index.html" class="sub-btn">목록으로</a>
            </div>
        </div>
        <div class="form-right">
            <div>
                <div class="right-icon">🥊</div>
                <div class="right-title">기록이 실력을 만든다</div>
                <p>러닝, 복싱, 오늘의 루틴을 남기고<br>어제보다 나은 나를 확인하세요.</p>
            </div>
        </div>
    </div>
</div>
<script>
function submitWorkout() {
    const type = document.getElementById('type').value;
    const duration = document.getElementById('duration').value;
    const memo = document.getElementById('memo').value;

    if (!duration || !memo) {
        alert('모든 항목을 입력해주세요.');
        return;
    }

    if (parseInt(duration) < 1) {
        alert('운동 시간은 1분 이상이어야 합니다.');
        return;
    }

    fetch('http://localhost:8080/api/workouts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, duration: parseInt(duration), memo })
    })
    .then(res => {
        if (!res.ok) {
            alert('저장에 실패했습니다. 입력값을 확인해주세요.');
            return;
        }
        return res.json();
    })
    .then(data => {
        if (data) window.location.href = 'index.html';
    })
    .catch(err => console.error('에러:', err));
}
</script>
</body>
</html>

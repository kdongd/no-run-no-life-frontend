<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>운동 기록 등록</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="form-page">
<div class="page">
    <div class="logo">NO RUN NO LIFE</div>
    <div class="form-card">
        <div class="form-left">
            <h1>운동 기록 등록</h1>
            <p class="description">오늘의 운동을 기록하고<br>나만의 운동 루틴을 쌓아보세요.</p>
            <div class="mb-4">
                <label class="form-label">운동 종류</label>
                <select id="type" class="form-select">
                    <option value="RUNNING">러닝</option>
                    <option value="BOXING">복싱</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label">운동 시간</label>
                <input type="number" id="duration" class="form-control" min="1" placeholder="분 단위로 입력하세요. 예: 30">
            </div>
            <div class="mb-4">
                <label class="form-label">운동 메모</label>
                <input type="text" id="memo" class="form-control" placeholder="예: 샌드백 10R 진행">
            </div>
            <div class="mb-4">
                <label class="form-label">운동 날짜/시간</label>
                <input type="datetime-local" id="workoutDateTime" class="form-control">
            </div>
            <div class="helper-box">
                입력한 운동 기록은 목록 화면에서 바로 확인할 수 있습니다.
                서버를 재시작하면 메모리 저장소의 기록은 초기화됩니다.
            </div>
            <div class="d-flex gap-3">
                <button class="main-btn" onclick="submitWorkout()">기록 저장하기</button>
                <a href="index.html" class="sub-btn">목록으로</a>
            </div>
        </div>
        <div class="form-right">
            <div>
                <div class="right-icon">🥊</div>
                <div class="right-title">기록이 실력을 만든다</div>
                <p>러닝, 복싱, 오늘의 루틴을 남기고<br>어제보다 나은 나를 확인하세요.</p>
            </div>
        </div>
    </div>
</div>
<script>
function submitWorkout() {
    const type = document.getElementById('type').value;
    const duration = document.getElementById('duration').value;
    const memo = document.getElementById('memo').value;
    const workoutDateTime = document.getElementById('workoutDateTime').value;

    if (!duration || !workoutDateTime) {
        alert('운동 시간과 날짜/시간은 필수입니다.');
        return;
    }

    if (parseInt(duration) < 1) {
        alert('운동 시간은 1분 이상이어야 합니다.');
        return;
    }

    fetch('http://localhost:8080/api/workouts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            type,
            durationMinutes: parseInt(duration),
            memo,
            workoutDateTime: workoutDateTime
        })
    })
    .then(res => {
        if (!res.ok) {
            alert('저장에 실패했습니다. 입력값을 확인해주세요.');
            return;
        }
        return res.json();
    })
    .then(data => {
        if (data) window.location.href = 'index.html';
    })
    .catch(err => console.error('에러:', err));
}
</script>
</body>
</html>

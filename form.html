<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>운동 기록 등록</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="form-page">
<div class="page">
    <div class="logo">NO RUN NO LIFE</div>
    <div class="form-card">
        <div class="form-left">
            <h1>운동 기록 등록</h1>
            <p class="description">오늘의 운동을 기록하고<br>나만의 운동 루틴을 쌓아보세요.</p>
            <div class="mb-4">
                <label class="form-label">운동 종류</label>
                <select id="type" class="form-select">
                    <option value="RUNNING">러닝</option>
                    <option value="BOXING">복싱</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label">운동 시간</label>
                <input type="number" id="duration" class="form-control" min="1" placeholder="분 단위로 입력하세요. 예: 30">
                <div id="error-duration" style="color:#ff6b6b;font-size:13px;margin-top:6px;display:none;"></div>
            </div>
            <div class="mb-4">
                <label class="form-label">운동 메모</label>
                <input type="text" id="memo" class="form-control" placeholder="예: 샌드백 10R 진행">
                <div id="error-memo" style="color:#ff6b6b;font-size:13px;margin-top:6px;display:none;"></div>
            </div>
            <div class="mb-4">
                <label class="form-label">운동 날짜/시간</label>
                <input type="datetime-local" id="workoutDateTime" class="form-control">
                <div id="error-workoutDateTime" style="color:#ff6b6b;font-size:13px;margin-top:6px;display:none;"></div>
            </div>
            <div class="mb-4">
                <label class="form-label">세부 기록</label>
                <div id="details-container"></div>
                <button type="button" class="sub-btn mt-2" onclick="addDetail()">+ 라운드 추가</button>
            </div>
            <div class="helper-box">
                입력한 운동 기록은 목록 화면에서 바로 확인할 수 있습니다.
                서버를 재시작하면 메모리 저장소의 기록은 초기화됩니다.
            </div>
            <div class="d-flex gap-3">
                <button class="main-btn" onclick="submitWorkout()">기록 저장하기</button>
                <a href="index.html" class="sub-btn">목록으로</a>
            </div>
        </div>
        <div class="form-right">
            <div>
                <div class="right-icon">🥊</div>
                <div class="right-title">기록이 실력을 만든다</div>
                <p>러닝, 복싱, 오늘의 루틴을 남기고<br>어제보다 나은 나를 확인하세요.</p>
            </div>
        </div>
    </div>
</div>
<script>
let detailSequence = 1;

function addDetail() {
    const container = document.getElementById('details-container');
    const seq = detailSequence++;
    const row = document.createElement('div');
    row.id = 'detail-row-' + seq;
    row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:10px;';
    row.innerHTML = `
        <input type="text" placeholder="라벨 (예: 1라운드)" class="form-control" style="flex:1;" id="detail-label-${seq}">
        <input type="number" placeholder="시간(초)" class="form-control" style="width:110px;" id="detail-seconds-${seq}" min="1">
        <input type="text" placeholder="노트" class="form-control" style="flex:1;" id="detail-note-${seq}">
        <button type="button" onclick="removeDetail(${seq})" style="background:none;border:1px solid #4b5563;color:#e5e7eb;border-radius:12px;padding:8px 14px;cursor:pointer;white-space:nowrap;">삭제</button>
    `;
    container.appendChild(row);
}

function removeDetail(seq) {
    const row = document.getElementById('detail-row-' + seq);
    if (row) row.remove();
}

function clearErrors() {
    ['duration', 'memo', 'workoutDateTime'].forEach(field => {
        const el = document.getElementById('error-' + field);
        if (el) { el.style.display = 'none'; el.textContent = ''; }
    });
}

function showErrors(errors) {
    const fieldMap = {
        durationMinutes: 'duration',
        memo: 'memo',
        workoutDateTime: 'workoutDateTime'
    };
    errors.forEach(err => {
        const elId = 'error-' + (fieldMap[err.field] || err.field);
        const el = document.getElementById(elId);
        if (el) { el.textContent = err.message; el.style.display = 'block'; }
    });
}

function submitWorkout() {
    clearErrors();

    const type = document.getElementById('type').value;
    const duration = document.getElementById('duration').value;
    const memo = document.getElementById('memo').value;
    const workoutDateTime = document.getElementById('workoutDateTime').value;

    const container = document.getElementById('details-container');
    const rows = container.querySelectorAll('[id^="detail-row-"]');
    const details = [];
    let seq = 1;
    rows.forEach(row => {
        const seqNum = row.id.replace('detail-row-', '');
        const label = document.getElementById('detail-label-' + seqNum)?.value;
        const seconds = document.getElementById('detail-seconds-' + seqNum)?.value;
        const note = document.getElementById('detail-note-' + seqNum)?.value;
        details.push({
            sequence: seq++,
            label: label || null,
            durationSeconds: seconds ? parseInt(seconds) : null,
            note: note || null
        });
    });

    fetch('http://localhost:8080/workouts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            type,
            durationMinutes: parseInt(duration),
            memo,
            workoutDateTime: workoutDateTime,
            details: details.length > 0 ? details : null
        })
    })
    .then(res => {
        if (res.status === 400) {
            return res.json().then(data => {
                showErrors(data.errors || []);
            });
        }
        if (!res.ok) {
            alert('저장에 실패했습니다. 입력값을 확인해주세요.');
            return;
        }
        return res.json().then(data => {
            if (data) window.location.href = 'index.html';
        });
    })
    .catch(err => console.error('에러:', err));
}
</script>
</body>
</html>
